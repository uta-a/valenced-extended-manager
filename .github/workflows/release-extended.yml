# valenced-extended: Manager のリリースを作る。上流の release.yml（semantic-release）の代わり。
# 版は `<上流の版>-ext.<n>`（例 1.1.2-ext.1）。CI 内で -Pversion に渡すだけで、コミットはしない
# （上流の版上げと衝突させないため）。アプリはこのリポジトリの最新リリースを見て自身を更新する。

name: "Release: Extended"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.1.2-ext.1), also used as the release tag
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # upstream リモートがあっても gh の操作対象をこのリポジトリにする
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    name: Build & release
    if: github.repository != 'Valenced/valenced-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate inputs
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ext\.[1-9][0-9]?$ ]]; then
            echo "::error::Invalid version: $VERSION (expected e.g. 1.1.2-ext.1)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Setup keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The KEYSTORE secret is required for releases."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > app/keystore.jks

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ vars.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon -Pversion="$VERSION"
          mkdir dist
          mv app/build/outputs/apk/release/*.apk "dist/valenced-extended-manager-$VERSION.apk"
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists."
            exit 1
          fi
          gh release create "$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.apk
